apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: storefront

build:
  artifacts:
    - image: storefront-frontend
      context: apps/storefront/frontend
    - image: storefront-catalog
      context: apps/storefront/catalog
    - image: storefront-payment
      context: apps/storefront/payment

profiles:
  # ── GKE: frontend only ────────────────────────────────────────────────────
  - name: gke-frontend
    manifests:
      kustomize:
        paths:
          - apps/storefront/frontend
    deploy:
      kubectl: {}
    verify:
    - name: frontend-health
      container:
        name: verify-frontend
        image: curlimages/curl:8.7.1
        command: ["sh", "-c"]
        args:
          - |
            curl -sf http://storefront-frontend.nexus-app.svc.cluster.local/health \
              || (echo "frontend health check failed" && exit 1)

  # ── GKE: payment only ─────────────────────────────────────────────────────
  - name: gke-payment
    manifests:
      kustomize:
        paths:
          - apps/storefront/payment
    deploy:
      kubectl: {}
    verify:
    - name: payment-health
      container:
        name: verify-payment
        image: curlimages/curl:8.7.1
        command: ["sh", "-c"]
        args:
          - |
            curl -sf http://storefront-payment.nexus-app.svc.cluster.local:8080/health \
              || (echo "payment health check failed" && exit 1)

  # ── EKS: catalog only ─────────────────────────────────────────────────────
  - name: eks
    manifests:
      kustomize:
        paths:
          - apps/storefront/catalog
    deploy:
      kubectl: {}
    verify:
    - name: catalog-health
      container:
        name: verify-catalog
        image: curlimages/curl:8.7.1
        command: ["sh", "-c"]
        args:
          - |
            curl -sf http://storefront-catalog.nexus-app.svc.cluster.local:8080/health \
              || (echo "catalog health check failed" && exit 1)
