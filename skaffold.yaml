# =============================================================================
# Skaffold — Cloud Deploy Manifest Renderer (per-service profiles)
# =============================================================================
# Service placement:
#   GKE Spoke (data-493511):
#     - frontend  → profile: gke-frontend  → kustomize: apps/storefront/gke-frontend
#     - payment   → profile: gke-payment   → kustomize: apps/storefront/gke-payment
#   EKS Spoke (AWS):
#     - catalog   → profile: eks           → kustomize: apps/storefront/eks
#
# Cloud Deploy passes --profile=<name> derived from the pipeline stage's
# profiles field. The --images flag substitutes image digests per release.
# =============================================================================

apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: storefront

build:
  artifacts:
    - image: storefront-frontend
      context: apps/storefront/frontend
    - image: storefront-catalog
      context: apps/storefront/catalog
    - image: storefront-payment
      context: apps/storefront/payment

profiles:
  # ── GKE: frontend only ────────────────────────────────────────────────────
  - name: gke-frontend
    manifests:
      kustomize:
        paths:
          - apps/storefront/gke-frontend
    deploy:
      kubectl: {}

  # ── GKE: payment only ─────────────────────────────────────────────────────
  - name: gke-payment
    manifests:
      kustomize:
        paths:
          - apps/storefront/gke-payment
    deploy:
      kubectl: {}

  # ── EKS: catalog only ─────────────────────────────────────────────────────
  - name: eks
    manifests:
      kustomize:
        paths:
          - apps/storefront/eks
    deploy:
      kubectl: {}
