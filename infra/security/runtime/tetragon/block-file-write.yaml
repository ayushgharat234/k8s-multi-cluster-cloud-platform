apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: block-file-write
spec:
  kprobes:
  - call: "sys_open"
    syscall: true
    args:
    - index: 0
      type: "string"
    - index: 1
      type: "int"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/etc/resolv.conf"
        - "/etc/passwd"
        - "/etc/shadow"
      - index: 1
        operator: "Mask"
        values:
        - "2" # O_RDWR
        - "1" # O_WRONLY
    matchActions:
    - action: SigKill
