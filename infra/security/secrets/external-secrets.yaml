apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: "${PROJECT_ID}"
      auth:
        workloadIdentity:
          clusterLocation: "${REGION}"
          clusterName: "${CLUSTER_NAME}"
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: prod-tenant-1
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: db-credentials-k8s
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: prod-db-creds
      property: username
  - secretKey: password
    remoteRef:
      key: prod-db-creds
      property: password
