apiVersion: database.gcp.dhi.io/v1alpha1
kind: PostgresInstance
metadata:
  name: platform-db
  namespace: backstage
spec:
  parameters:
    storageGB: 10
    machineType: db-custom-1-3840 # Smallest
    availabilityType: REGIONAL # HA
  compositionSelector:
    matchLabels:
      provider: gcp
      type: production
