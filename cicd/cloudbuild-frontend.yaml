# Cloud Build — storefront-frontend  SLSA Level 3
# Trigger: apps/storefront/frontend/** path filter on prod branch

steps:
  # ── Build ─────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    args:
      - build
      - -t
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-frontend:$COMMIT_SHA'
      - apps/storefront/frontend

  # ── Push + capture immutable digest ───────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: push
    entrypoint: bash
    args:
      - '-c'
      - |
        docker push us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-frontend:$COMMIT_SHA
        docker inspect --format='{{index .RepoDigests 0}}' \
          us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-frontend:$COMMIT_SHA \
          | cut -d'@' -f2 > /workspace/digest.txt
        echo "Digest: $$(cat /workspace/digest.txt)"
    waitFor: [build]

  # ── Vulnerability Gate ─────────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: vuln-gate
    entrypoint: bash
    args:
      - '-c'
      - |
        cat > /workspace/count_vulns.py << 'PYEOF'
        import json, sys
        try:
            data = json.load(sys.stdin)
            vulns = data.get('package_vulnerability_summary', {}).get('vulnerabilities', {})
            critical = len(vulns.get('CRITICAL', []))
            high = len(vulns.get('HIGH', []))
            print(str(critical) + ' ' + str(high))
        except Exception:
            print('-1 -1')
        PYEOF
        echo "Waiting 120s for Container Analysis scan..."
        sleep 120
        DIGEST=$$(cat /workspace/digest.txt)
        IMAGE="us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-frontend@$$DIGEST"
        echo "Scanning: $$IMAGE"
        COUNTS=$$(gcloud artifacts docker images describe "$$IMAGE" \
          --show-package-vulnerability --project=$PROJECT_ID \
          --format=json | python3 /workspace/count_vulns.py)
        CRITICAL=$$(echo "$$COUNTS" | awk '{print $1}')
        HIGH=$$(echo "$$COUNTS" | awk '{print $2}')
        if [ "$$CRITICAL" -lt 0 ]; then
          echo "ERROR: Failed to parse vulnerability data" && exit 1
        fi
        echo "CRITICAL=$$CRITICAL  HIGH=$$HIGH"
        if [ "$$CRITICAL" -gt 0 ]; then
          echo "BLOCKED: CRITICAL CVEs found in storefront-frontend" && exit 1
        fi
        if [ "$$HIGH" -gt 5 ]; then
          echo "BLOCKED: $$HIGH HIGH CVEs exceed threshold (5) in storefront-frontend" && exit 1
        fi
        echo "Vulnerability gate passed."
    waitFor: [push]

  # ── Binary Authorization Attestation ─────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: attest
    entrypoint: bash
    args:
      - '-c'
      - |
        DIGEST=$$(cat /workspace/digest.txt)
        FULL_IMAGE="us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-frontend@$$DIGEST"
        echo "Attesting $$FULL_IMAGE"
        gcloud beta container binauthz attestations sign-and-create \
          --artifact-url="$$FULL_IMAGE" \
          --attestor=opsnexus-hub-attestor \
          --attestor-project=$PROJECT_ID \
          --keyversion-project=$PROJECT_ID \
          --keyversion-location=us-central1 \
          --keyversion-keyring=opsnexus-cluster-ring \
          --keyversion-key=cosign-key \
          --keyversion=1
    waitFor: [vuln-gate]

  # ── Cloud Deploy Release ───────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    entrypoint: bash
    args:
      - '-c'
      - |
        gcloud deploy apply --file=apps/cloud-deploy/targets.yaml \
          --region=us-central1 --project=$PROJECT_ID
        gcloud deploy apply --file=apps/cloud-deploy/frontend-pipeline.yaml \
          --region=us-central1 --project=$PROJECT_ID
        gcloud deploy apply --file=apps/cloud-deploy/frontend-automation.yaml \
          --region=us-central1 --project=$PROJECT_ID

        DIGEST=$$(cat /workspace/digest.txt)
        gcloud deploy releases create "release-$SHORT_SHA" \
          --project=$PROJECT_ID --region=us-central1 \
          --delivery-pipeline=frontend-pipeline \
          --skaffold-file=skaffold.yaml --source=. \
          --images="storefront-frontend=us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-frontend@$$DIGEST"
    waitFor: [attest]

serviceAccount: 'projects/dotted-saga-493511-a1/serviceAccounts/opsnexus-ci-sa@dotted-saga-493511-a1.iam.gserviceaccount.com'

options:
  requestedVerifyOption: VERIFIED
  logging: CLOUD_LOGGING_ONLY

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-frontend:$COMMIT_SHA'
