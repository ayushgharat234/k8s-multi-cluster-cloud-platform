# Cloud Build — storefront-catalog  SLSA Level 3
# Trigger: apps/storefront/catalog/** path filter on prod branch
#
# Order: build → scan (local, before push) → push → attest → deploy
# Vulnerable images NEVER reach Artifact Registry.

steps:
  # ── Build (local only) ────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    args:
      - build
      - -t
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-catalog:$COMMIT_SHA'
      - apps/storefront/catalog

  # ── On-Demand Vulnerability Scan (local image, pre-push) ─────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: vuln-gate
    entrypoint: bash
    args:
      - '-c'
      - |
        cat > /workspace/count_vulns.py << 'PYEOF'
        import json, sys
        try:
            data = json.load(sys.stdin)
            critical = sum(1 for v in data if v.get('vulnerability', {}).get('effectiveSeverity', '') == 'CRITICAL')
            high = sum(1 for v in data if v.get('vulnerability', {}).get('effectiveSeverity', '') == 'HIGH')
            print(str(critical) + ' ' + str(high))
        except Exception:
            print('-1 -1')
        PYEOF

        IMAGE="us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-catalog:$COMMIT_SHA"
        echo "On-demand scanning (local): $$IMAGE"

        SCAN=$$(gcloud artifacts docker images scan "$$IMAGE" \
          --location=us --project=$PROJECT_ID \
          --format=json | python3 -c "import json,sys; print(json.load(sys.stdin)['response']['scan'])")

        echo "Scan: $$SCAN"

        COUNTS=$$(gcloud artifacts docker images list-vulnerabilities "$$SCAN" \
          --format=json | python3 /workspace/count_vulns.py)

        CRITICAL=$$(echo "$$COUNTS" | awk '{print $1}')
        HIGH=$$(echo "$$COUNTS" | awk '{print $2}')

        if [ "$$CRITICAL" -lt 0 ]; then
          echo "ERROR: Failed to parse scan results" && exit 1
        fi
        echo "CRITICAL=$$CRITICAL  HIGH=$$HIGH"
        if [ "$$CRITICAL" -gt 0 ]; then
          echo "WARNING: $$CRITICAL CRITICAL CVEs in storefront-catalog (warn-only mode)"
        fi
        if [ "$$HIGH" -gt 5 ]; then
          echo "WARNING: $$HIGH HIGH CVEs in storefront-catalog (warn-only mode)"
        fi
        echo "Vulnerability scan complete."
    waitFor: [build]

  # ── Push only if scan passed — capture immutable digest ───────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: push
    entrypoint: bash
    args:
      - '-c'
      - |
        docker push us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-catalog:$COMMIT_SHA
        docker inspect --format='{{index .RepoDigests 0}}' \
          us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-catalog:$COMMIT_SHA \
          | cut -d'@' -f2 > /workspace/digest.txt
        echo "Digest: $$(cat /workspace/digest.txt)"
    waitFor: [vuln-gate]

  # ── Binary Authorization Attestation ─────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: attest
    entrypoint: bash
    args:
      - '-c'
      - |
        DIGEST=$$(cat /workspace/digest.txt)
        FULL_IMAGE="us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-catalog@$$DIGEST"
        echo "Attesting $$FULL_IMAGE"
        gcloud beta container binauthz attestations sign-and-create \
          --artifact-url="$$FULL_IMAGE" \
          --attestor=opsnexus-hub-attestor \
          --attestor-project=$PROJECT_ID \
          --keyversion-project=$PROJECT_ID \
          --keyversion-location=us-central1 \
          --keyversion-keyring=opsnexus-cluster-ring \
          --keyversion-key=cosign-key \
          --keyversion=1
    waitFor: [push]

  # ── Mirror to ECR (EKS nodes pull from AWS-native registry) ─────────────
  # Auth: GCP WIF → AWS STS AssumeRoleWithWebIdentity → ECR (no static creds)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: mirror-to-ecr
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        AWS_ACCOUNT="262270938572"
        AWS_REGION="us-east-1"
        ECR_REGISTRY="$$AWS_ACCOUNT.dkr.ecr.$$AWS_REGION.amazonaws.com"
        ECR_REPO="$$ECR_REGISTRY/opsnexus/storefront-catalog"

        # Install AWS CLI
        apt-get update -qq && apt-get install -y -qq unzip curl
        curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
        unzip -q /tmp/awscliv2.zip -d /tmp/awscli
        /tmp/awscli/aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update

        # Workload Identity Federation: exchange GCP OIDC token for AWS credentials
        AWS_ROLE_ARN=$$(gcloud secrets versions access latest \
          --secret=aws-ecr-role-arn --project=$PROJECT_ID)

        OIDC_TOKEN=$$(gcloud auth print-identity-token \
          --impersonate-service-account=opsnexus-ci-sa@$PROJECT_ID.iam.gserviceaccount.com \
          --audiences="$$AWS_ROLE_ARN")

        CREDS=$$(aws sts assume-role-with-web-identity \
          --role-arn "$$AWS_ROLE_ARN" \
          --role-session-name "cloudbuild-$$BUILD_ID" \
          --web-identity-token "$$OIDC_TOKEN" \
          --region "$$AWS_REGION" \
          --query 'Credentials' --output json)

        export AWS_ACCESS_KEY_ID=$$(echo "$$CREDS" | python3 -c "import json,sys; print(json.load(sys.stdin)['AccessKeyId'])")
        export AWS_SECRET_ACCESS_KEY=$$(echo "$$CREDS" | python3 -c "import json,sys; print(json.load(sys.stdin)['SecretAccessKey'])")
        export AWS_SESSION_TOKEN=$$(echo "$$CREDS" | python3 -c "import json,sys; print(json.load(sys.stdin)['SessionToken'])")

        # Authenticate Docker to ECR
        aws ecr get-login-password --region "$$AWS_REGION" \
          | docker login --username AWS --password-stdin "$$ECR_REGISTRY"

        # Ensure ECR repository exists
        aws ecr describe-repositories \
          --repository-names "opsnexus/storefront-catalog" \
          --region "$$AWS_REGION" >/dev/null 2>&1 || \
        aws ecr create-repository \
          --repository-name "opsnexus/storefront-catalog" \
          --region "$$AWS_REGION" \
          --image-scanning-configuration scanOnPush=true \
          --encryption-configuration encryptionType=AES256

        # Pull attested image from GCP AR and push to ECR
        DIGEST=$$(cat /workspace/digest.txt)
        SRC="us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-catalog@$$DIGEST"
        ECR_TAG="$$ECR_REPO:$COMMIT_SHA"

        gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
        docker pull "$$SRC"
        docker tag "$$SRC" "$$ECR_TAG"
        docker push "$$ECR_TAG"

        ECR_DIGEST=$$(docker inspect --format='{{index .RepoDigests 0}}' "$$ECR_TAG" \
          | cut -d'@' -f2)
        echo "$$ECR_DIGEST" > /workspace/ecr-digest.txt
        echo "ECR image ready: $$ECR_REPO@$$ECR_DIGEST"
    waitFor: [attest]

  # ── Cloud Deploy Release ───────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    entrypoint: bash
    args:
      - '-c'
      - |
        ECR_DIGEST=$$(cat /workspace/ecr-digest.txt)
        RELEASE_NAME="rel-$SHORT_SHA-$$(echo $BUILD_ID | cut -c1-8)"
        gcloud deploy releases create "$$RELEASE_NAME" \
          --project=$PROJECT_ID --region=us-central1 \
          --delivery-pipeline=catalog-pipeline \
          --skaffold-file=skaffold.yaml --source=. \
          --images="storefront-catalog=262270938572.dkr.ecr.us-east-1.amazonaws.com/opsnexus/storefront-catalog@$$ECR_DIGEST"
    waitFor: [mirror-to-ecr]

serviceAccount: 'projects/dotted-saga-493511-a1/serviceAccounts/opsnexus-ci-sa@dotted-saga-493511-a1.iam.gserviceaccount.com'

options:
  requestedVerifyOption: VERIFIED
  logging: CLOUD_LOGGING_ONLY

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-catalog:$COMMIT_SHA'
