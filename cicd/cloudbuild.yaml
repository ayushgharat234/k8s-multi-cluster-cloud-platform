# Cloud Build — OpsNexus SLSA Level 3 CI Pipeline
# Steps: build → push → vuln gate → binauthz attest → cloud deploy release

steps:
  # ── Build ───────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build-frontend
    args: [build, -t, 'us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-frontend:$COMMIT_SHA', apps/storefront/frontend]

  - name: 'gcr.io/cloud-builders/docker'
    id: build-catalog
    args: [build, -t, 'us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-catalog:$COMMIT_SHA', apps/storefront/catalog]

  - name: 'gcr.io/cloud-builders/docker'
    id: build-payment
    args: [build, -t, 'us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-payment:$COMMIT_SHA', apps/storefront/payment]

  # ── Push ────────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: push-frontend
    args: [push, 'us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-frontend:$COMMIT_SHA']
    waitFor: [build-frontend]

  - name: 'gcr.io/cloud-builders/docker'
    id: push-catalog
    args: [push, 'us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-catalog:$COMMIT_SHA']
    waitFor: [build-catalog]

  - name: 'gcr.io/cloud-builders/docker'
    id: push-payment
    args: [push, 'us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-payment:$COMMIT_SHA']
    waitFor: [build-payment]

  # ── Vulnerability Gate ───────────────────────────────────────────────────────
  # Container Analysis scans on push. Wait 60s then block on HIGH/CRITICAL CVEs.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: vuln-gate
    entrypoint: bash
    args:
      - '-c'
      - |
        echo "Waiting 60s for Container Analysis scan..."
        sleep 60
        for service in frontend catalog payment; do
          bash cicd/check-vulnerabilities.sh \
            "us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-$${service}:$COMMIT_SHA" \
            "$PROJECT_ID"
        done
    waitFor: [push-frontend, push-catalog, push-payment]

  # ── Binary Authorization Attestation ────────────────────────────────────────
  # Native GCP signing — no external tools needed.
  # Creates a KMS-signed attestation in Container Analysis.
  # GKE admission webhook checks this before allowing any pod to run.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: attest-images
    entrypoint: bash
    args:
      - '-c'
      - |
        for service in frontend catalog payment; do
          IMAGE="us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-$${service}:$COMMIT_SHA"
          # Get digest directly from docker push output stored in image manifest
          DIGEST=$$(gcloud artifacts docker images list \
            "us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-$${service}" \
            --filter="tags=$COMMIT_SHA" \
            --format='value(version)' --project=$PROJECT_ID)
          FULL_IMAGE="us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-$${service}@$$DIGEST"
          echo "Attesting $$FULL_IMAGE"
          gcloud beta container binauthz attestations sign-and-create \
            --artifact-url="$$FULL_IMAGE" \
            --attestor=opsnexus-hub-attestor \
            --attestor-project=$PROJECT_ID \
            --keyversion-project=$PROJECT_ID \
            --keyversion-location=us-central1 \
            --keyversion-keyring=opsnexus-cluster-ring \
            --keyversion-key=cosign-key \
            --keyversion=1
        done
    waitFor: [vuln-gate]

  # ── Cloud Deploy Release ─────────────────────────────────────────────────────
  # Passes image digests (immutable) — not tags.
  # profile gke  → frontend + payment → GKE Spoke  (canary 25%→75%→100%)
  # profile eks  → catalog            → EKS Spoke  (full, after GKE stable)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    entrypoint: bash
    args:
      - '-c'
      - |
        gcloud deploy apply \
          --file=apps/cloud-deploy/pipeline.yaml \
          --region=us-central1 \
          --project=$PROJECT_ID

        FRONTEND_DIGEST=$$(gcloud artifacts docker images list \
          "us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-frontend" \
          --filter="tags=$COMMIT_SHA" --format='value(version)' --project=$PROJECT_ID)
        CATALOG_DIGEST=$$(gcloud artifacts docker images list \
          "us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-catalog" \
          --filter="tags=$COMMIT_SHA" --format='value(version)' --project=$PROJECT_ID)
        PAYMENT_DIGEST=$$(gcloud artifacts docker images list \
          "us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-payment" \
          --filter="tags=$COMMIT_SHA" --format='value(version)' --project=$PROJECT_ID)

        gcloud deploy releases create "release-$SHORT_SHA" \
          --project=$PROJECT_ID \
          --region=us-central1 \
          --delivery-pipeline=storefront-pipeline \
          --skaffold-file=skaffold.yaml \
          --source=. \
          --images="storefront-frontend=us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-frontend@$$FRONTEND_DIGEST,storefront-catalog=us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-catalog@$$CATALOG_DIGEST,storefront-payment=us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-payment@$$PAYMENT_DIGEST"
    waitFor: [attest-images]

serviceAccount: 'projects/dotted-saga-493511-a1/serviceAccounts/opsnexus-ci-sa@dotted-saga-493511-a1.iam.gserviceaccount.com'

options:
  requestedVerifyOption: VERIFIED
  logging: CLOUD_LOGGING_ONLY

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-frontend:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-catalog:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-payment:$COMMIT_SHA'
