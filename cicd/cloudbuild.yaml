# Cloud Build — OpsNexus SLSA Level 3 CI Pipeline
# Steps: build → push (capture digest) → vuln gate → binauthz attest → cloud deploy release

steps:
  # ── Build ───────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build-frontend
    args: [build, -t, 'us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-frontend:$COMMIT_SHA', apps/storefront/frontend]

  - name: 'gcr.io/cloud-builders/docker'
    id: build-catalog
    args: [build, -t, 'us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-catalog:$COMMIT_SHA', apps/storefront/catalog]

  - name: 'gcr.io/cloud-builders/docker'
    id: build-payment
    args: [build, -t, 'us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-payment:$COMMIT_SHA', apps/storefront/payment]

  # ── Push + capture digest to /workspace/ ────────────────────────────────────
  # /workspace/ is shared across all steps in the build.
  - name: 'gcr.io/cloud-builders/docker'
    id: push-frontend
    entrypoint: bash
    args:
      - '-c'
      - |
        docker push us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-frontend:$COMMIT_SHA
        docker inspect --format='{{index .RepoDigests 0}}' \
          us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-frontend:$COMMIT_SHA \
          | cut -d'@' -f2 > /workspace/frontend-digest.txt
        cat /workspace/frontend-digest.txt
    waitFor: [build-frontend]

  - name: 'gcr.io/cloud-builders/docker'
    id: push-catalog
    entrypoint: bash
    args:
      - '-c'
      - |
        docker push us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-catalog:$COMMIT_SHA
        docker inspect --format='{{index .RepoDigests 0}}' \
          us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-catalog:$COMMIT_SHA \
          | cut -d'@' -f2 > /workspace/catalog-digest.txt
        cat /workspace/catalog-digest.txt
    waitFor: [build-catalog]

  - name: 'gcr.io/cloud-builders/docker'
    id: push-payment
    entrypoint: bash
    args:
      - '-c'
      - |
        docker push us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-payment:$COMMIT_SHA
        docker inspect --format='{{index .RepoDigests 0}}' \
          us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-payment:$COMMIT_SHA \
          | cut -d'@' -f2 > /workspace/payment-digest.txt
        cat /workspace/payment-digest.txt
    waitFor: [build-payment]

  # ── Vulnerability Gate ───────────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: vuln-gate
    entrypoint: bash
    args:
      - '-c'
      - |
        echo "Waiting 60s for Container Analysis scan..."
        sleep 60
        for service in frontend catalog payment; do
          IMAGE="us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-$${service}:$COMMIT_SHA"
          echo "Checking vulnerabilities for: $$IMAGE"
          CRITICAL=$$(gcloud artifacts docker images describe "$$IMAGE" \
            --show-package-vulnerability --project=$PROJECT_ID \
            --format='value(package_vulnerability_summary.vulnerabilities.CRITICAL)' 2>/dev/null || echo "0")
          HIGH=$$(gcloud artifacts docker images describe "$$IMAGE" \
            --show-package-vulnerability --project=$PROJECT_ID \
            --format='value(package_vulnerability_summary.vulnerabilities.HIGH)' 2>/dev/null || echo "0")
          CRITICAL=$${CRITICAL:-0}
          HIGH=$${HIGH:-0}
          echo "  CRITICAL: $$CRITICAL  HIGH: $$HIGH"
          if [ "$${CRITICAL}" -gt 0 ] 2>/dev/null; then
            echo "BLOCKED: CRITICAL CVEs found in storefront-$${service}"
            exit 1
          fi
          if [ "$${HIGH}" -gt 5 ] 2>/dev/null; then
            echo "BLOCKED: $$HIGH HIGH CVEs exceed threshold (5) in storefront-$${service}"
            exit 1
          fi
          echo "  Passed."
        done
    waitFor: [push-frontend, push-catalog, push-payment]

  # ── Binary Authorization Attestation ────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: attest-images
    entrypoint: bash
    args:
      - '-c'
      - |
        for service in frontend catalog payment; do
          DIGEST=$$(cat /workspace/$${service}-digest.txt)
          FULL_IMAGE="us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-$${service}@$$DIGEST"
          echo "Attesting $$FULL_IMAGE"
          gcloud beta container binauthz attestations sign-and-create \
            --artifact-url="$$FULL_IMAGE" \
            --attestor=opsnexus-hub-attestor \
            --attestor-project=$PROJECT_ID \
            --keyversion-project=$PROJECT_ID \
            --keyversion-location=us-central1 \
            --keyversion-keyring=opsnexus-cluster-ring \
            --keyversion-key=cosign-key \
            --keyversion=1
        done
    waitFor: [vuln-gate]

  # ── Cloud Deploy Release ─────────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    entrypoint: bash
    args:
      - '-c'
      - |
        gcloud deploy apply \
          --file=apps/cloud-deploy/pipeline.yaml \
          --region=us-central1 \
          --project=$PROJECT_ID

        FRONTEND_DIGEST=$$(cat /workspace/frontend-digest.txt)
        CATALOG_DIGEST=$$(cat /workspace/catalog-digest.txt)
        PAYMENT_DIGEST=$$(cat /workspace/payment-digest.txt)

        gcloud deploy releases create "release-$SHORT_SHA" \
          --project=$PROJECT_ID \
          --region=us-central1 \
          --delivery-pipeline=storefront-pipeline \
          --skaffold-file=skaffold.yaml \
          --source=. \
          --images="storefront-frontend=us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-frontend@$$FRONTEND_DIGEST,storefront-catalog=us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-catalog@$$CATALOG_DIGEST,storefront-payment=us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-payment@$$PAYMENT_DIGEST"
    waitFor: [attest-images]

serviceAccount: 'projects/dotted-saga-493511-a1/serviceAccounts/opsnexus-ci-sa@dotted-saga-493511-a1.iam.gserviceaccount.com'

options:
  requestedVerifyOption: VERIFIED
  logging: CLOUD_LOGGING_ONLY

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-frontend:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-catalog:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/opsnexus/storefront-payment:$COMMIT_SHA'
