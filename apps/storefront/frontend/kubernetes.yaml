apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-frontend
  namespace: nexus-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront-frontend
  template:
    metadata:
      labels:
        app: storefront-frontend
    spec:
      containers:
      - name: frontend
        image: storefront-frontend
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-frontend
  namespace: nexus-app
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: storefront-frontend
