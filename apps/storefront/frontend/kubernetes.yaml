apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-frontend
  namespace: nexus-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront-frontend
  template:
    metadata:
      labels:
        app: storefront-frontend
        app.kubernetes.io/part-of: storefront
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp-nginx
        emptyDir: {}
      containers:
      - name: frontend
        image: storefront-frontend
        env:
        - name: CATALOG_URL
          value: "http://PLACEHOLDER_EKS_LB:8080"
        ports:
        - containerPort: 80
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp-nginx
          mountPath: /tmp/nginx
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-frontend
  namespace: nexus-app
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: storefront-frontend
