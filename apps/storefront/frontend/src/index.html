<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpsNexus Sovereign Storefront</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f1f5f9; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); border: 1px solid #334155; text-align: center; }
        h1 { color: #38bdf8; }
        .status { margin-top: 1.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .node { padding: 1rem; border-radius: 0.5rem; background: #334155; }
        .tag { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; }
        .pulse { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #10b981; box-shadow: 0 0 0 rgba(16, 185, 129, 0.4); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
    </style>
</head>
<body>
    <div class="card">
        <h1>OpsNexus Storefront</h1>
        <p>Sovereign Multi-Cloud Microservices</p>
        <div class="status">
            <div class="node">
                <div class="tag">GCP Hub (GKE)</div>
                <div class="pulse"></div> Connected
            </div>
            <div class="node">
                <div class="tag">AWS Spoke (EKS)</div>
                <div class="pulse"></div> Connected
            </div>
        </div>
    </div>
</body>
</html>
