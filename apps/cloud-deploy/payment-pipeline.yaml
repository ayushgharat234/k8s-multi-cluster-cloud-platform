apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: payment-pipeline
description: "storefront-payment → GKE Spoke — canary 25→75→100%"
serialPipeline:
  stages:
  - targetId: gke-spoke
    profiles: [gke-payment]
    strategy:
      canary:
        runtimeConfig:
          kubernetes:
            serviceNetworking:
              deployment: storefront-payment
              service: storefront-payment
        canaryDeployment:
          percentages: [25, 75]
