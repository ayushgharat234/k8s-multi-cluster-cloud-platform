# Pipeline 1: GKE — frontend + payment (canary 25→75→100)
apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: gke-storefront-pipeline
description: "frontend + payment → GKE Spoke canary"
serialPipeline:
  stages:
  - targetId: gke-spoke
    profiles: [gke]
    strategy:
      canary:
        runtimeConfig:
          kubernetes:
            serviceNetworking:
              deployment: storefront-frontend
              service: storefront-frontend
        canaryDeployment:
          percentages: [25, 75]

---
# Pipeline 2: EKS — catalog (canary 25→75→100)
apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: eks-storefront-pipeline
description: "catalog → EKS Spoke canary"
serialPipeline:
  stages:
  - targetId: eks-spoke
    profiles: [eks]
    strategy:
      canary:
        runtimeConfig:
          kubernetes:
            serviceNetworking:
              deployment: storefront-catalog
              service: storefront-catalog
        canaryDeployment:
          percentages: [25, 75]

---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: gke-spoke
description: "GKE Spoke — data-493511 — frontend + payment"
gke:
  cluster: projects/data-493511/locations/us-central1/clusters/opsnexus-spoke-cluster

---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: eks-spoke
description: "EKS Spoke — AWS — catalog"
anthosCluster:
  membership: projects/dotted-saga-493511-a1/locations/global/memberships/opsnexus-eks-spoke
